# Deployment bindings for corpus/packages/L1.dtsx
#
# An SSIS connection manager says "localhost, AdventureWorksDW2014, Integrated
# Security=SSPI". None of that survives a move to NiFi: Windows integrated
# security has no JDBC equivalent, and "localhost" means a different machine.
# So the package says WHICH logical connection each component uses, and this
# file says what that resolves to at deploy time.
#
# This is not a workaround -- it is what SSIS project configurations and
# environment references already do. It is also what makes the SQL Server ->
# Postgres retarget below a bindings edit rather than a converter change.
#
# NO SECRETS HERE. `password_ref` names an environment variable; the value is
# never written into this file or into the generated flow.json.

bindings:
  db_main:
    for: "Package.ConnectionManagers[localhost.AdventureWorksDW2014]"
    # The package targets SQL Server. This deployment targets Postgres, which
    # is what db_type exists to express -- PutDatabaseRecord generates dialect
    # -specific SQL from it.
    db_type: "PostgreSQL"
    # Postgres folds unquoted identifiers to lower case; SQL Server does not
    # care. The .dtsx says [dbo].[NewFactCurrencyRate], which is a different
    # (missing) table here unless it is folded.
    identifier_case: lower
    url: "jdbc:postgresql://postgres:5432/ssis2nifi"
    driver_class: "org.postgresql.Driver"
    driver_path: "/opt/nifi/drivers/postgresql.jar"
    user: "etl"
    password_ref: "SSIS2NIFI_DB_MAIN_PASSWORD"

  input_file:
    for: "Package.ConnectionManagers[Sample Flat File Source Data]"
    directory: "/opt/nifi/data/ssis2nifi/landing"
    file_filter: ".*\\.txt"
